name: Sayago AI Hub Build

on:
  push:
    paths:
      - "sayago-ai-hub/**"
      - ".github/workflows/sayago-ai-hub-build.yml"
  pull_request:
    paths:
      - "sayago-ai-hub/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sayago-ai-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
